# Builds the site and publishes it on GitHub Pages every time `main` is
# pushed (or when you press "Run workflow" on the Actions tab).
#
# One-time setup on GitHub: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
#
# The tests run first: if any fail, nothing is published.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only what's needed: read the code, write to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes happen close together, only the newest one deploys.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install packages (exactly as in package-lock.json)
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Build the site into dist/
        run: npm run build

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload dist/ for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
